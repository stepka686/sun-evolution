# Тесты на каждый пуш и пул-реквест; на main — ещё и публикация сборки на GitHub Pages
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Сайт для Pages
        run: |
          mkdir -p _site/releases
          cp dist/sun_evolution_v*.html _site/index.html
          cp releases/*.html _site/releases/
          {
            echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Версии</title><h1>Все версии</h1><ul>'
            for f in $(ls releases/*.html | sort -V -r); do n=$(basename "$f"); echo "<li><a href=\"$n\">$n</a></li>"; done
            echo '</ul>'
          } > _site/releases/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
